name: Deploy portfolio to GitHub Pages

# Builds the Astro site and publishes dist/ through GitHub's official Pages
# actions. The repository's GitHub Pages build type must be set to
# "GitHub Actions" before this workflow is allowed to deploy; until then this
# workflow only builds and uploads the artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and let a newer push cancel an
# in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify custom domain survived the build
        run: |
          if [ ! -f dist/CNAME ]; then
            echo "dist/CNAME is missing; refusing to publish without the custom domain."
            exit 1
          fi
          cat dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
