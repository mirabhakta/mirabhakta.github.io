<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Jarvis: a message into a workflow</title>
  <desc id="description">Architecture diagram. iMessage connects through Photon to an authorized agent router, with branches for developer tools, local knowledge, and operations.</desc>
  <rect width="1200" height="750" fill="#eeeae4"/>
  <text x="64" y="72" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#5a5a62">AI AGENTS · WORKFLOW AUTOMATION</text>
  <text x="60" y="178" font-family="Georgia,serif" font-size="92" letter-spacing="-3" fill="#17171a">Jarvis</text>
  <text x="64" y="223" font-family="Arial,sans-serif" font-size="27" fill="#3a3a42">A message into a workflow.</text>
  <g fill="none" stroke="#a7a2be" stroke-width="3">
