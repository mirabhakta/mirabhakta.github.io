  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="182" y="342" font-size="29" fill="#17171a">iMessage</text>
    <text x="600" y="342" font-size="29" fill="#17171a">Photon</text>
    <text x="1018" y="328" font-size="28" fill="#ffffff">Agent router</text>
    <text x="1018" y="357" font-size="15" fill="#f2f1ee">authorization + delivery state</text>
  </g>
  <g fill="#e1dde9">
